# Scrapes the execution worker's GET /metrics.
#
# The worker is expected on the host at WORKER_HEALTH_ADDR (default :3002).
# host.docker.internal resolves to the host on Docker Desktop, and
# docker/compose/monitoring.yml maps it to the host gateway on Linux. A worker
# on another machine is added as a further target.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/worker.yml

scrape_configs:
  - job_name: ambatucode-worker
    static_configs:
      - targets: ["host.docker.internal:3002"]
        labels:
          worker: local
