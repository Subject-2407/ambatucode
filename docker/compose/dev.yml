name: ambatucode-dev

# Local development dependencies only. The sandbox images live in
# docker/compose/sandbox.yml and are driven exclusively by apps/worker.
# Neither service here is ever given access to the Docker socket.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ambatucode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambatucode
      POSTGRES_PASSWORD: ambatucode
      POSTGRES_DB: ambatucode
    # Published on 5433 rather than 5432. A developer machine very often already
    # runs a PostgreSQL of its own on the default port, and the failure when it
    # does is genuinely hard to read: Docker still reports the port as published
    # because it wins the IPv6 bind, so the container looks healthy and `psql`
    # inside it works, while every connection from the host quietly reaches the
    # other server and comes back "authentication failed". Moving the project
    # off the contested port costs nothing and removes the whole class of it.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambatucode -d ambatucode"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ambatucode-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
