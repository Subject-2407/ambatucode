# /etc/nginx/sites-available/ambatucode
#
# Single-domain reverse proxy for apps/web (Next.js) and apps/realtime
# (Socket.IO), both published on 127.0.0.1 only by docker/compose/prod.yml.
# Split by path rather than by subdomain: Socket.IO's server and client both
# already default to path "/socket.io" (see apps/realtime/src/server.ts and
# apps/web/src/lib/socket.ts), so nginx only needs to route that one path
# to a different backend — no extra DNS record or certificate needed.
#
# With this setup, NEXT_PUBLIC_REALTIME_URL and REALTIME_CORS_ORIGIN in
# deploy/.env.production are the exact same value: this domain. They are
# conceptually different (one is where the browser connects the socket, the
# other is the origin the server allows), they just happen to coincide here
# because both apps are served from one origin.
#
# Replace ambatucode.stevan.id with the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/ambatucode /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ambatucode.stevan.id

server {
    listen 80;
    listen [::]:80;
    server_name ambatucode.stevan.id;

    # Must come before location / — nginx matches the most specific prefix,
    # but keeping this first is clearer to read.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Socket.IO needs the Upgrade/Connection headers forwarded, or every
        # connection silently falls back to (and gets stuck on) long-polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A long-lived websocket must outlive nginx's default 60s proxy
        # timeout, or idle connections get dropped and silently reconnect.
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
