# /etc/nginx/sites-available/ambatucode
#
# Reverse proxy for apps/web (Next.js) and apps/realtime (Socket.IO), both
# published on 127.0.0.1 only by docker/compose/prod.yml. This is the only
# thing meant to be reachable from outside the host.
#
# Replace app.example.com / realtime.example.com with the real hostnames
# (must match REALTIME_CORS_ORIGIN / NEXT_PUBLIC_REALTIME_URL in
# deploy/.env.production), then:
#   sudo ln -s /etc/nginx/sites-available/ambatucode /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com -d realtime.example.com

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name realtime.example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Socket.IO needs the Upgrade/Connection headers forwarded, or every
        # connection silently falls back to (and gets stuck on) long-polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A long-lived websocket must outlive nginx's default 60s proxy
        # timeout, or idle connections get dropped and silently reconnect.
        proxy_read_timeout 86400;
    }
}
