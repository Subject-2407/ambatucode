# This server (ambatucode.stevan.id) is fronted by Apache under
# Virtualmin/Webmin, not nginx — deploy/nginx/ambatucode.conf does not apply
# here. Paste the block below into this domain's Apache directives:
#
#   Virtualmin UI: the domain -> Services / Server Configuration ->
#   "Edit Directives" -> paste -> Save. If the domain also has SSL enabled
#   (a separate :443 VirtualHost, which Virtualmin creates alongside :80),
#   Virtualmin's "Edit Directives" page usually lets you pick which
#   VirtualHost to edit — paste it into BOTH, or the app only works over
#   plain HTTP.
#
#   No Virtualmin access: hand this file to the server admin to insert into
#   the matching <VirtualHost> block(s) in
#   /etc/apache2/sites-available/ambatucode.stevan.id.conf, then reload:
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Needs mod_proxy, mod_proxy_http, mod_proxy_wstunnel, and mod_rewrite
# enabled server-wide first (check with:
#   ls /etc/apache2/mods-enabled/ | grep -iE "proxy|rewrite"
# ) — enabling a module is server-wide, so if any are missing this part
# needs the admin:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo systemctl restart apache2
#
# Ports below (3000, 3011) match docker/compose/prod.yml's WEB_PORT and
# REALTIME_PORT for this deployment — update them here too if either changes
# in deploy/.env.production.

ProxyPreserveHost On

# Socket.IO (apps/realtime) — a conditional rewrite so both the HTTP-polling
# handshake and the websocket upgrade proxy correctly. A plain ProxyPass with
# a ws:// target would break the HTTP-polling fallback Engine.IO tries
# before it upgrades.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3011/socket.io/$1 [P,L]
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule ^/socket\.io/(.*) http://127.0.0.1:3011/socket.io/$1 [P,L]
ProxyPassReverse /socket.io/ http://127.0.0.1:3011/socket.io/

# Everything else -> apps/web. The exclusion line keeps the catch-all below
# from also claiming /socket.io/ requests.
ProxyPass /socket.io/ !
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
